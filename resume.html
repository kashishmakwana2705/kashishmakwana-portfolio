<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UI/UX Certificate</title>

<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="project-style.css">

<style>

body{

background:linear-gradient(180deg,#CFEFFF,#FFF8EF);
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;

}

.certificate-page{

max-width:1000px;
width:80%;
padding:110px 20px 50px;
text-align:center;

display:flex;
flex-direction:column;
align-items:center;

}

.back-btn{

position:fixed;

top:24px;
left:24px;

display:inline-flex;
align-items:center;
gap:10px;

text-decoration:none;

background:white;
color:#6B4F4F;

padding:12px 22px;

border-radius:50px;

font-weight:700;

box-shadow:0 8px 20px rgba(0,0,0,.08);

transition:.3s;

z-index:1000;

}

.back-btn:hover{

transform:translateX(-5px);

}

.certificate-image{

display:block;
margin:0 auto;

width:100%;
max-width:900px;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.15);

border:5px solid white;

}

@media(max-width:500px){

.back-btn{

top:16px;
left:16px;

padding:10px 16px;
font-size:14px;

}

.certificate-page{

padding:85px 15px 40px;

}

}

</style>

</head>

<body>

<div class="certificate-page">

<a href="index.html" class="back-btn">

← Back

</a>

<img
class="certificate-image"
src="resume.png"
alt="UI UX Certificate">

</div>

</body>

</html>
